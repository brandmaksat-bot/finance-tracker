<!doctype html>
<!--
  Трекер – мини-приложение Telegram: траты и привычки.
  Назначение: ввод трат и отметка привычек (вкладка «Ввод»), сводка недели, месяцев
  и календарь привычек (вкладка «Сводка»);
  данные хранит Code.gs в Google Таблице.
  Внешние API (сверено 08.11.2026): Telegram Mini Apps – https://core.telegram.org/bots/webapps
  Адрес сервера передаётся параметром ?api= (его подставляет setup() в Code.gs).
  Без Telegram страница открывается в демо-режиме с тестовыми данными.
  Публикация: GitHub Pages, см. README.md.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Трекер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F2ED;--card:#FFFFFF;--sunk:#EDEAE3;--sunk-press:#E2DED5;
  --ink:#1C1B19;--ink2:#5E5A53;--ink3:#736E66;--line:rgba(28,27,25,.09);
  --seg-on:#FFFFFF;--ok:#2F6B57;--ok-soft:#E1EEE7;--warn:#875810;--warn-soft:#F5EAD5;--bad:#A0461F;--bad-soft:#F7E4DA;--blue:#335E99;
  --scrim:rgba(28,27,25,.18);
  --r:22px;
}
html[data-theme="dark"]{
  --bg:#121211;--card:#1C1B19;--sunk:#272623;--sunk-press:#33312D;
  --ink:#F1EEE7;--ink2:#B6B1A7;--ink3:#8F8A81;--line:rgba(255,255,255,.08);
  --seg-on:#3A3834;--ok:#7DB89F;--ok-soft:#1E2F28;--warn:#E3A857;--warn-soft:#352A18;--bad:#E58566;--bad-soft:#3A231B;--blue:#86A9DB;
  --scrim:rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Onest,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
main{max-width:480px;margin:0 auto;padding:12px 16px calc(28px + env(safe-area-inset-bottom))}
.tabs{display:flex;background:var(--sunk);border-radius:14px;padding:3px;margin-bottom:10px}
.tabs button{flex:1;height:36px;border-radius:11px;font-weight:500;color:var(--ink2);transition:background .2s,color .2s}
.tabs button.on{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:10px}
.label{font-size:13px;color:var(--ink2)}
.hero{padding:14px 16px}
.hero-num{font-size:44px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin:4px 0 2px}
.hero .hero-num{font-size:34px;margin:2px 0 0}
.hero-num small{font-size:24px;font-weight:500;color:var(--ink3);margin-left:4px}
.track{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:14px}
.hero .track{margin-top:10px}
.fill{width:100%;height:100%;background:var(--ok);transform-origin:left center;transform:scaleX(0);transition:transform .5s cubic-bezier(.2,.8,.2,1),background .3s}
.st-low .fill{background:var(--warn)} .st-over .fill{background:var(--bad)}
.st-over .hero-num{color:var(--bad)}
.row-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px}
.seg button{height:30px;padding:0 12px;border-radius:9px;font-size:13px;color:var(--ink2);transition:background .2s,color .2s}
.seg button.on{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.seg.wide{display:flex;margin-top:10px}
.seg.wide button{flex:1;height:34px;font-size:14px}
.seg.wide button.on.imp{color:var(--bad)}
.amount-row{margin:2px 0 14px}
.amount{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1;white-space:nowrap}
.amount.zero{color:var(--ink3)}
.amount small{font-size:26px;font-weight:500;color:var(--ink3);margin-left:6px}
.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:33px;padding:0 12px;border-radius:18px;border:1px solid var(--line);font-size:14px;display:inline-flex;align-items:center;gap:7px;transition:background .15s,color .15s,border-color .15s}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.k-weekend i{background:var(--ok)} .k-reserve i{background:var(--warn)} .k-savings i{background:var(--blue)}
.field{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:16px;outline:none}
.field:focus{border-color:var(--ink3)}
#note{margin-top:10px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
.key{height:46px;border-radius:16px;background:var(--sunk);font-size:24px;font-weight:500;transition:transform .08s,background .08s;user-select:none}
.key:active{transform:scale(.96);background:var(--sunk-press)}
.save{width:100%;height:52px;margin-top:8px;border-radius:16px;background:var(--ink);color:var(--bg);font-size:16px;font-weight:600;transition:transform .08s}
.save:active{transform:scale(.98)}
.hint{min-height:18px;margin-top:6px;text-align:center;font-size:13px;color:var(--bad)}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.list-row:first-child{border-top:0}
.er{display:flex;flex-direction:column;gap:2px;min-width:0}
.er-note{font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
.er-date{font-size:12px;color:var(--ink3)}
.list-row .num{white-space:nowrap}
.tag{font-size:12px;padding:2px 8px;border-radius:8px;margin-left:6px;white-space:nowrap}
.tag.imp{background:var(--bad-soft);color:var(--bad)}
.tag.weekend{background:var(--ok-soft);color:var(--ok)}
.tag.reserve{background:var(--warn-soft);color:var(--warn)}
.tag.savings{background:var(--sunk);color:var(--blue)}
.ghost{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);font-weight:500;margin-top:12px}
.empty{padding:6px 0 2px;color:var(--ink3)}
.bars{display:flex;align-items:stretch;gap:8px;height:120px;position:relative;margin-top:18px}
.bcol{flex:1;display:flex;align-items:flex-end;height:100%;position:relative;z-index:1}
.bcol:disabled{cursor:default}
.b{width:100%;border-radius:6px 6px 3px 3px;background:var(--ink);min-height:3px;transition:opacity .2s,background .2s}
.b.zero{background:var(--sunk)} .b.future{height:100%;background:transparent;border:1px dashed var(--line)}
.b.over{background:var(--bad)}
.bars.has-sel .bcol:not(.sel) .b:not(.future){opacity:.32}
.bcol.sel .b.zero{background:var(--ink3)}
.bars .line{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ink3);opacity:.6;pointer-events:none;z-index:2}
.days{display:flex;gap:8px;margin-top:6px}
.days button{flex:1;text-align:center;font-size:12px;color:var(--ink3);height:22px;border-radius:6px}
.days button.now{color:var(--ink);font-weight:600}
.days button.sel{background:var(--sunk);color:var(--ink)}
.days button:disabled{cursor:default}
.daybox{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.daybox .h3{font-size:15px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.tile{background:var(--sunk);border-radius:14px;padding:10px 12px}
.tile b{display:block;font-size:20px;font-weight:600;margin-top:2px;white-space:nowrap}
.tile .sub{display:block;font-size:12px;color:var(--ink2)}
.tile .sub.bad{color:var(--bad)}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mhead .h{margin:0;text-align:center;flex:1}
.arrow{width:36px;height:36px;border-radius:50%;background:var(--sunk);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);transition:transform .08s}
.arrow:active{transform:scale(.94)}
.arrow[hidden]{display:inline-flex!important;visibility:hidden}
.arrow svg{width:18px;height:18px}
.mdots{display:flex;justify-content:center;gap:5px;margin:2px 0 8px}
.mdots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.mdots i.on{background:var(--ink2)}
.mbody{transition:opacity .18s}
.mbody.fade{opacity:.25}
.mrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow span:last-child{white-space:nowrap}
.cat{padding:8px 0}
.cat .track{height:4px;margin-top:6px}
.cat .fill{background:var(--ink2)}
.h{font-size:17px;font-weight:600;margin:0 0 12px}
.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-start;justify-content:center;padding:14vh 16px 16px;background:var(--scrim);-webkit-backdrop-filter:blur(12px) saturate(1.1);backdrop-filter:blur(12px) saturate(1.1);opacity:0;transition:opacity .22s}
.overlay.show{opacity:1}
.sheet{width:100%;max-width:440px;background:var(--card);border-radius:24px;padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.18);transform:translateY(14px) scale(.98);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.overlay.show .sheet{transform:none}
.sheet h3{margin:0;font-size:19px;font-weight:600}
.sheet .field{margin-top:14px}
.sugs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sugs .chip{height:32px;font-size:13px;background:var(--sunk);border-color:transparent}
.sheet-actions{display:flex;gap:8px;margin-top:16px}
.sheet-actions .btn2{flex:0 0 38%;height:50px;border-radius:16px;background:var(--sunk);font-weight:500}
.sheet-actions .save{flex:1;margin-top:0;height:50px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);text-align:center;z-index:40}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--bad);color:#fff}
.hhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:2px}
.hhead .h{margin:0}
.hctl{display:flex;align-items:center;gap:8px}
.plus{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;transition:transform .08s}
.plus:active{transform:scale(.94)}
.plus svg{width:18px;height:18px}
.hrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hcheck{flex:0 0 36px;height:36px;border-radius:11px;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:transparent;transition:background .15s,border-color .15s,color .15s,transform .08s}
.hcheck svg{width:19px;height:19px}
.hcheck.on{background:var(--ok);border-color:var(--ok);color:var(--card)}
.hcheck:active{transform:scale(.94)}
.hname{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.hs{white-space:nowrap;font-size:13px;color:var(--ink2)}
.hs b{font-size:17px;font-weight:600;color:var(--ink);margin-right:3px}
.hs.zero b{color:var(--ink3)}
.hnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.hnav-mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px}
.hnav .hm-name{text-align:center}
.hm{transition:opacity .18s}
.hm.fade{opacity:.25}
.hm .hm-sub{text-align:center;margin-top:4px}
.hm-name{font-weight:600;text-align:left;overflow-wrap:anywhere}
.hm-sub{font-size:13px;color:var(--ink2);margin-top:1px}
.hgrid{display:grid;grid-template-columns:repeat(7,30px);gap:5px;margin:10px auto 4px;width:max-content}
.hgrid span{font-size:10px;color:var(--ink3);text-align:center}
.hgrid i{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--card)}
.hgrid i.on{background:var(--ok);border-color:var(--ok)}
.hgrid i.on svg{width:16px;height:16px}
.hgrid i.off{border-style:dashed;opacity:.45}
.hgrid i.cur{border-color:var(--ink3)}
.hgrid i.on.cur{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--ink3)}
.hgrid b{visibility:hidden}
.demo{font-size:12px;text-align:center;color:var(--ink3);margin:-4px 0 10px}
.fatal{padding:40px 8px;text-align:center;color:var(--ink2)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="app">
  <div class="demo" id="demo" hidden>Демо-режим: тестовые данные, ничего не сохраняется</div>
  <nav class="tabs" role="tablist">
    <button id="tab-add" class="on" role="tab">Ввод</button>
    <button id="tab-sum" role="tab">Сводка</button>
  </nav>

  <section id="view-add">
    <div class="card hero" id="hero">
      <div class="label" id="hero-label">Осталось до воскресенья</div>
      <div class="hero-num num"><span id="hero-num">–</span><small>₽</small></div>
      <div class="label num" id="hero-sub">&nbsp;</div>
      <div class="track"><div class="fill" id="hero-fill"></div></div>
    </div>

    <div class="card">
      <div class="row-top amount-row">
        <div class="amount num zero" id="amount" aria-live="polite">0<small>₽</small></div>
        <div class="seg" id="day-seg"><button data-day="today" class="on">Сегодня</button><button data-day="yesterday">Вчера</button></div>
      </div>
      <div class="chips" id="chips"></div>
      <div class="seg wide" id="intent"><button data-imp="0" class="on">Планировал</button><button data-imp="1" class="imp">Импульс</button></div>
      <input class="field" id="note" maxlength="200" placeholder="Что было в тот момент: устал, торопился, скучно" hidden>
      <div class="pad" id="pad"></div>
      <button class="save" id="save">Записать</button>
      <div class="hint" id="hint"></div>
    </div>

    <div class="card" id="hab-card">
      <div class="hhead">
        <h2 class="h">Привычки</h2>
        <div class="hctl">
          <div class="seg" id="hab-day"><button data-d="0" class="on">Сегодня</button><button data-d="1">Вчера</button></div>
          <button class="plus" id="hab-add" aria-label="Добавить привычку"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
      </div>
      <div id="hab-list" style="margin-top:6px"></div>
    </div>
    <div class="card">
      <div class="row-top"><span class="h" style="margin:0">Сегодня</span><span class="label num" id="today-sum"></span></div>
      <div id="today-list" style="margin-top:6px"></div>
    </div>
  </section>

  <section id="view-sum" hidden>
    <div class="card">
      <div class="label" id="w-label">Неделя</div>
      <div class="hero-num num" style="font-size:34px"><span id="w-spent">–</span><small>₽</small></div>
      <div class="label num" id="w-sub"></div>
      <div class="bars" id="bars"></div>
      <div class="days" id="days"></div>
      <div class="daybox" id="daybox">
        <div class="row-top"><span class="h3" id="day-title"></span><span class="label num" id="day-sum"></span></div>
        <div id="day-list" style="margin-top:4px"></div>
      </div>
      <div class="tiles">
        <div class="tile"><span class="label">Импульс</span><b class="num" id="w-imp">–</b><span class="sub">от трат</span></div>
        <div class="tile"><span class="label">Без трат</span><b class="num" id="w-nospend">–</b><span class="sub" id="w-nospend-sub">дней</span></div>
        <div class="tile"><span class="label">Выходные</span><b class="num" id="w-weekend">–</b><span class="sub num" id="w-weekend-sub"></span></div>
      </div>
    </div>

    <div id="months">
      <div class="card" id="month-card">
        <div class="mhead">
          <button class="arrow" id="m-prev" aria-label="Предыдущий месяц"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
          <h2 class="h" id="m-label">Месяц</h2>
          <button class="arrow" id="m-next" aria-label="Следующий месяц"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
        <div class="mdots" id="m-dots"></div>
        <div class="mbody" id="m-body">
          <div id="m-rows"></div>
          <div class="cat" style="border-top:1px solid var(--line);padding-top:12px">
            <div class="row-top"><span>Непредвиденное</span><span class="num" id="m-reserve"></span></div>
            <div class="track"><div class="fill" id="m-reserve-fill"></div></div>
          </div>
        </div>
      </div>

      <div class="card" id="habm-card">
        <div class="row-top"><h2 class="h" style="margin:0">Привычки</h2><span class="label" id="habm-label"></span></div>
        <div id="habm"></div>
      </div>
      <div class="card" id="noted-card">
        <h2 class="h">Пояснения</h2>
        <div id="noted"></div>
      </div>

      <div class="card" id="cats-card">
        <h2 class="h">Куда уходит</h2>
        <div id="cats"></div>
      </div>

      <div class="card" id="notes-card">
        <h2 class="h">Что было в момент импульса</h2>
        <div id="notes"></div>
      </div>
    </div>
  </section>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h3 id="sheet-title">Пояснение</h3>
    <div class="label num" id="sheet-sub" style="margin-top:2px"></div>
    <input class="field" id="sheet-input" maxlength="200" placeholder="На что потрачено" enterkeyhint="done" autocomplete="off">
    <div class="sugs" id="sheet-sugs"></div>
    <div class="hint" id="sheet-hint" style="text-align:left"></div>
    <div class="sheet-actions">
      <button class="btn2" id="sheet-cancel">Отмена</button>
      <button class="save" id="sheet-ok">Записать</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
(function () {
  'use strict';

  var CATS = [
    ['Продукты', 'living'], ['Кофе', 'living'], ['Такси', 'living'], ['Автобус', 'living'], ['Дом', 'living'],
    ['Ребёнок', 'living'], ['Себе', 'living'], ['Другое', 'living'], ['Выходные', 'weekend'], ['Здоровье', 'reserve'],
    ['Непредвиденное', 'reserve'], ['С накоплений', 'savings']
  ];
  var KIND = {}; CATS.forEach(function (c) { KIND[c[0]] = c[1]; }); KIND['Без трат'] = 'none';
  var NOTE_REQ = { 'Себе': 1, 'Другое': 1, 'Выходные': 1, 'Здоровье': 1, 'Непредвиденное': 1, 'С накоплений': 1 };
  var TAG = { weekend: 'выходные', reserve: 'непредвиденное', savings: 'с накоплений' };
  var TAG_CAT = { 'Непредвиденное': 'упс' }; // чтобы метка не повторяла название категории
  var HABIT_NAME_MAX = 40;
  var DAYS = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];
  var DAYS_FULL = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];
  var MONTHS_SHORT = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  var MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  var MONTHS = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
  var CACHE_KEY = 'ft-state-v2';

  var tg = window.Telegram && window.Telegram.WebApp;
  var initData = (tg && tg.initData) || '';
  var qs = new URLSearchParams(location.search);
  var API = qs.get('api') || '';
  var DEMO = !initData;

  var S = null;
  var F = { amount: '', category: 'Продукты', impulse: false, note: '', day: 'today' };
  var pending = 0;
  var selDay = null;   // выбранный день недели в сводке
  var monthIdx = 0;    // 0 – текущий месяц, дальше – прошлые
  var noteOpen = false;
  var sheetMode = 'note'; // окно ввода: 'note' – пояснение к трате, 'habit' – новая привычка
  var habDay = 0;         // привычки: 0 – отмечаем сегодня, 1 – вчера
  var habErr = '';        // ошибка загрузки, если сервер не ответил
  var habIdx = 0;         // какая привычка открыта в «Сводке» (календари листаются по одному)

  function $(id) { return document.getElementById(id); }
  function fmt(n) { return Math.round(n).toLocaleString('ru-RU'); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function plural(n, a, b, c) { var x = n % 10, y = n % 100; return x === 1 && y !== 11 ? a : (x >= 2 && x <= 4 && (y < 12 || y > 14) ? b : c); }
  function addDays(ymd, n) { var d = new Date(ymd + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function diffDays(a, b) { return Math.round((new Date(a + 'T00:00:00Z') - new Date(b + 'T00:00:00Z')) / 864e5); }
  function shortDate(ymd) { var d = ymd.split('-'); return Number(d[2]) + ' ' + MONTHS_SHORT[Number(d[1]) - 1]; }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function shake(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
  function haptic(kind) {
    try {
      if (!tg || !tg.HapticFeedback) return;
      if (kind === 'tap') tg.HapticFeedback.impactOccurred('light');
      else tg.HapticFeedback.notificationOccurred(kind);
    } catch (e) {}
  }

  /* ---------- тема ---------- */
  function applyTheme() {
    var dark = tg && initData ? tg.colorScheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var bg = dark ? '#121211' : '#F4F2ED';
    try { if (tg && tg.isVersionAtLeast('6.9')) { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } } catch (e) {}
    try { if (tg && tg.isVersionAtLeast('7.10')) tg.setBottomBarColor(bg); } catch (e) {}
  }

  /* ---------- сервер ---------- */
  function api(action, payload) {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, 25000);
    return fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ initData: initData, action: action, payload: payload || {} }),
      signal: ctl.signal
    }).then(function (r) { return r.json(); })
      .then(function (j) { if (!j.ok) throw new Error(j.error || 'Ошибка сервера'); return j.data; })
      .catch(function (e) {
        if (e.name === 'AbortError') throw new Error('Сервер не ответил, попробуйте ещё раз');
        if (e instanceof TypeError) throw new Error('Нет связи с сервером');
        throw e;
      })
      .finally(function () { clearTimeout(timer); });
  }
  function saveCache() { try { if (!DEMO) localStorage.setItem(CACHE_KEY, JSON.stringify(S)); } catch (e) {} }
  function loadCache() { try { return JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch (e) { return null; } }

  /* ---------- локальное применение записи (до ответа сервера) ---------- */
  function weekIdx(date) {
    var i = diffDays(date, addDays(S.today, -S.dayIndex));
    return i >= 0 && i < 7 ? i : -1;
  }
  function upsert(list, item, sign) {
    if (sign > 0) { list.unshift(item); return; }
    for (var i = 0; i < list.length; i++) if (list[i].id === item.id) { list.splice(i, 1); return; }
  }
  function applyLocal(e, sign) {
    var k = e.kind, a = e.amount * sign, wi = weekIdx(e.date);
    var m = S.months.filter(function (x) { return x.key === e.date.slice(0, 7); })[0];
    var lite = { id: e.id, date: e.date, category: e.category, kind: k, amount: e.amount, impulse: !!e.impulse, note: e.note || '' };
    if (k === 'none') {
      if (wi >= 0) S.week.days[wi].noSpend = sign > 0;
      if (e.date === S.today) S.todayMarkedNoSpend = sign > 0;
      return;
    }
    if (e.date === S.today) upsert(S.todayEntries, Object.assign({}, lite), sign);
    if (wi >= 0) {
      var d = S.week.days[wi];
      upsert(d.entries, Object.assign({}, lite), sign);
      if (k === 'living') {
        d.living += a; S.week.living += a; S.week.left -= a;
        if (e.impulse) S.week.impulse += a;
      }
      if (k === 'weekend') S.week.weekend += a;
    }
    if (m) {
      if (typeof m[k] === 'number') m[k] += a;
      if (k === 'savings') m.savingsCount += sign;
      if (k === 'living') {
        if (e.impulse) m.impulse += a;
        var t = m.top.filter(function (x) { return x.category === e.category; })[0];
        if (t) t.amount += a; else if (sign > 0) m.top.push({ category: e.category, amount: e.amount });
        m.top = m.top.filter(function (x) { return x.amount > 0; }).sort(function (x, y) { return y.amount - x.amount; });
        if (e.impulse && e.note) upsert(m.impulseNotes, Object.assign({}, lite), sign);
      }
      if (NOTE_REQ[e.category] && e.note) upsert(m.notes, Object.assign({}, lite), sign);
    }
    if (sign > 0 && NOTE_REQ[e.category] && e.note) {
      var list = (S.suggestions[e.category] || []).filter(function (x) { return x !== e.note; });
      list.unshift(e.note); S.suggestions[e.category] = list.slice(0, 4);
    }
  }

  // undo – откат локального изменения, если сервер вернул ошибку
  function send(action, payload, undo) {
    if (DEMO) return;
    pending++;
    api(action, payload).then(function (data) {
      pending--;
      if (pending === 0) { S = data; saveCache(); render(); }
    }).catch(function (err) {
      pending--;
      if (undo) { undo(); render(); }
      toast(err.message, true); haptic('error');
    });
  }

  /* ---------- ввод ---------- */
  function buildForm() {
    $('chips').innerHTML = CATS.map(function (c) {
      var cls = 'k-' + c[1];
      return '<button class="chip ' + cls + '" data-cat="' + esc(c[0]) + '">' + (cls === 'k-living' ? '' : '<i></i>') + esc(c[0]) + '</button>';
    }).join('');
    var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '00', '0', '⌫'];
    $('pad').innerHTML = keys.map(function (k) {
      return '<button class="key num" data-key="' + k + '"' + (k === '⌫' ? ' aria-label="Стереть"' : '') + '>' + k + '</button>';
    }).join('');

    $('chips').addEventListener('click', function (ev) {
      var b = ev.target.closest('.chip'); if (!b) return;
      F.category = b.getAttribute('data-cat'); haptic('tap'); renderForm();
    });
    $('pad').addEventListener('click', function (ev) {
      var b = ev.target.closest('.key'); if (b) press(b.getAttribute('data-key'));
    });
    $('intent').addEventListener('click', function (ev) {
      var b = ev.target.closest('button'); if (!b) return;
      F.impulse = b.getAttribute('data-imp') === '1'; haptic('tap'); renderForm();
    });
    $('day-seg').addEventListener('click', function (ev) {
      var b = ev.target.closest('button'); if (!b) return;
      F.day = b.getAttribute('data-day'); haptic('tap'); renderForm();
    });
    $('note').addEventListener('input', function () { F.note = this.value; });
    $('save').addEventListener('click', submit);

    $('sheet-ok').addEventListener('click', confirmSheet);
    $('sheet-cancel').addEventListener('click', closeNote);
    $('overlay').addEventListener('click', function (ev) { if (ev.target === this) closeNote(); });
    $('sheet-input').addEventListener('input', function () { $('sheet-hint').textContent = ''; });
    $('sheet-input').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); confirmSheet(); } });
    $('sheet-sugs').addEventListener('click', function (ev) {
      var b = ev.target.closest('.chip'); if (!b) return;
      $('sheet-input').value = b.getAttribute('data-note'); $('sheet-hint').textContent = ''; haptic('tap');
      $('sheet-input').focus();
    });

    document.addEventListener('keydown', function (ev) {
      if (noteOpen) { if (ev.key === 'Escape') closeNote(); return; }
      if (ev.target.tagName === 'INPUT' || $('view-add').hidden) return;
      if (/^[0-9]$/.test(ev.key)) press(ev.key);
      else if (ev.key === 'Backspace') press('⌫');
      else if (ev.key === 'Enter') submit();
    });
  }

  function press(k) {
    haptic('tap'); $('hint').textContent = '';
    if (k === '⌫') F.amount = F.amount.slice(0, -1);
    else if ((F.amount + k).replace(/^0+/, '').length <= 7) F.amount = (F.amount + k).replace(/^0+/, '');
    renderForm();
  }

  function renderForm() {
    var a = parseInt(F.amount || '0', 10);
    var el = $('amount');
    el.innerHTML = fmt(a) + '<small>₽</small>';
    el.classList.toggle('zero', !a);
    Array.prototype.forEach.call($('chips').children, function (b) { b.classList.toggle('on', b.getAttribute('data-cat') === F.category); });
    var living = KIND[F.category] === 'living';
    $('intent').hidden = !living;
    Array.prototype.forEach.call($('intent').children, function (b) { b.classList.toggle('on', (b.getAttribute('data-imp') === '1') === F.impulse); });
    $('note').hidden = !(living && F.impulse && !NOTE_REQ[F.category]);
    $('note').value = F.note;
    Array.prototype.forEach.call($('day-seg').children, function (b) { b.classList.toggle('on', b.getAttribute('data-day') === F.day); });
    var verb = F.category === 'С накоплений' ? 'Записать перевод' : 'Записать';
    $('save').textContent = a ? verb + ' ' + fmt(a) + ' ₽' : verb;
  }

  function submit() {
    if (!S) return;
    var a = parseInt(F.amount || '0', 10);
    if (!a) { $('hint').textContent = 'Наберите сумму'; haptic('error'); shake($('amount')); return; }
    if (NOTE_REQ[F.category]) { openNote(); return; }
    save(F.impulse && KIND[F.category] === 'living' ? F.note.trim() : '');
  }

  function save(note) {
    var a = parseInt(F.amount || '0', 10);
    var living = KIND[F.category] === 'living';
    var payload = { category: F.category, amount: a, impulse: living && F.impulse, note: note, daysAgo: F.day === 'today' ? 0 : 1 };
    var entry = Object.assign({ id: 'tmp-' + Date.now(), kind: KIND[F.category], date: addDays(S.today, -payload.daysAgo) }, payload);
    applyLocal(entry, 1);
    var said = F.category + ', ' + fmt(a) + ' ₽' + (F.day === 'yesterday' ? ' (вчера)' : '');
    F.amount = ''; F.impulse = false; F.note = ''; F.day = 'today';
    render(); haptic('success'); toast('Записано: ' + said);
    send('add', payload, function () { applyLocal(entry, -1); });
  }

  /* ---------- окно ввода: пояснение или новая привычка ---------- */
  function setSheet(mode, title, sub, placeholder, okText, maxLen) {
    sheetMode = mode;
    $('sheet-title').textContent = title;
    $('sheet-sub').textContent = sub;
    $('sheet-input').placeholder = placeholder;
    $('sheet-input').maxLength = maxLen;
    $('sheet-ok').textContent = okText;
    $('sheet-input').value = ''; $('sheet-hint').textContent = '';
  }
  function openNote() {
    var a = parseInt(F.amount || '0', 10);
    setSheet('note', 'Пояснение', F.category + ' · ' + fmt(a) + ' ₽' + (F.day === 'yesterday' ? ' · вчера' : ''), 'На что потрачено', 'Записать', 200);
    var sugs = (S.suggestions && S.suggestions[F.category]) || [];
    $('sheet-sugs').innerHTML = sugs.map(function (s) { return '<button class="chip" data-note="' + esc(s) + '">' + esc(s) + '</button>'; }).join('');
    $('sheet-sugs').hidden = !sugs.length;
    openSheet();
  }
  function openHabitSheet() {
    if (!S || !S.habits) { toast(habErr || 'Привычки ещё загружаются, попробуйте через секунду', !!habErr); return; }
    setSheet('habit', 'Новая привычка', 'Отмечайте каждый день – трекер посчитает, сколько дней подряд', 'Например: зарядка, 20 страниц, без сладкого', 'Добавить', HABIT_NAME_MAX);
    $('sheet-sugs').innerHTML = ''; $('sheet-sugs').hidden = true;
    openSheet();
  }
  function openSheet() {
    var ov = $('overlay');
    noteOpen = true;
    ov.hidden = false;
    $('sheet-input').focus();
    requestAnimationFrame(function () { if (noteOpen) ov.classList.add('show'); });
    haptic('tap');
  }
  function closeNote() {
    var ov = $('overlay');
    noteOpen = false;
    ov.classList.remove('show');
    $('sheet-input').blur();
    setTimeout(function () { if (!noteOpen) ov.hidden = true; }, 230);
  }
  function sheetError(text) {
    $('sheet-hint').textContent = text; haptic('error'); shake($('sheet-input')); $('sheet-input').focus();
  }
  function confirmSheet() {
    if (sheetMode === 'habit') { confirmHabit(); return; }
    var v = $('sheet-input').value.trim();
    if (!v) { sheetError('Напишите, на что потрачено'); return; }
    closeNote(); save(v);
  }

  /* ---------- удаление ---------- */
  function findEntry(id) {
    for (var i = 0; i < S.week.days.length; i++) {
      var e = S.week.days[i].entries.filter(function (x) { return x.id === id; })[0];
      if (e) return e;
    }
    return null;
  }
  function markNoSpend() {
    var entry = { id: 'tmp-' + Date.now(), kind: 'none', category: 'Без трат', amount: 0, date: S.today };
    applyLocal(entry, 1); render(); haptic('success'); toast('День отмечен без трат');
    send('add', { category: 'Без трат', amount: 0, daysAgo: 0 }, function () { applyLocal(entry, -1); });
  }
  function askDelete(id) {
    if (id.indexOf('tmp-') === 0) { toast('Запись ещё сохраняется, попробуйте через секунду'); return; }
    var e = findEntry(id);
    if (!e) return;
    var text = 'Удалить «' + e.category + ', ' + fmt(e.amount) + ' ₽»' + (e.date === S.today ? '' : ' за ' + shortDate(e.date)) + '?';
    var go = function (ok) {
      if (!ok) return;
      var entry = Object.assign({}, e);
      applyLocal(entry, -1); render(); toast('Удалено');
      send('delete', { id: id }, function () { applyLocal(entry, 1); });
    };
    if (tg && !DEMO && tg.isVersionAtLeast('6.2')) tg.showConfirm(text, go); else go(window.confirm(text));
  }

  /* ---------- отрисовка ---------- */
  function entryRow(e, opts) {
    opts = opts || {};
    var label = TAG_CAT[e.category] || TAG[e.kind];
    var tag = e.impulse ? '<span class="tag imp">импульс</span>' : (label ? '<span class="tag ' + e.kind + '">' + label + '</span>' : '');
    var inner = '<span class="er">' +
      (opts.date ? '<span class="er-date">' + shortDate(e.date) + '</span>' : '') +
      '<span>' + esc(e.category) + tag + '</span>' +
      (e.note ? '<span class="er-note">' + esc(e.note) + '</span>' : '') +
      '</span><span class="num">' + fmt(e.amount) + ' ₽</span>';
    return opts.deletable
      ? '<button class="list-row" data-id="' + esc(e.id) + '">' + inner + '</button>'
      : '<div class="list-row">' + inner + '</div>';
  }
  function bindDelete(container) {
    Array.prototype.forEach.call(container.querySelectorAll('button.list-row'), function (r) {
      r.addEventListener('click', function () { askDelete(r.getAttribute('data-id')); });
    });
  }

  function render() {
    if (!S) return;
    renderHero(); renderForm(); renderToday(); renderWeek(); renderMonth(false); renderHabits();
  }

  function renderHero() {
    var L = S.settings.weeklyLimit, left = S.week.left, spent = S.week.living;
    var hero = $('hero');
    hero.classList.toggle('st-over', left < 0);
    hero.classList.toggle('st-low', left >= 0 && left < L * 0.2);
    $('hero-label').textContent = left >= 0 ? 'Осталось до воскресенья' : 'Перерасход за неделю';
    $('hero-num').textContent = fmt(Math.abs(left));
    var sub = 'из ' + fmt(L) + ' ₽ · ' + S.daysLeft + ' ' + plural(S.daysLeft, 'день', 'дня', 'дней');
    if (left > 0) sub += ' · ≈ ' + fmt(Math.floor(left / S.daysLeft)) + ' в день';
    $('hero-sub').textContent = sub;
    $('hero-fill').style.transform = 'scaleX(' + Math.min(1, L ? spent / L : 0) + ')';
  }

  function renderToday() {
    var list = S.todayEntries;
    var sum = list.reduce(function (s, e) { return s + (e.kind === 'savings' ? 0 : e.amount); }, 0);
    $('today-sum').textContent = list.length ? fmt(sum) + ' ₽' : '';
    if (!list.length) {
      $('today-list').innerHTML = S.todayMarkedNoSpend
        ? '<div class="empty">Отмечен день без трат</div>'
        : '<div class="empty">Пока ничего не записано</div><button class="ghost" id="nospend">Сегодня без трат</button>';
      var b = $('nospend'); if (b) b.addEventListener('click', markNoSpend);
      return;
    }
    $('today-list').innerHTML = list.map(function (e) { return entryRow(e, { deletable: true }); }).join('');
    bindDelete($('today-list'));
  }

  function renderWeek() {
    var w = S.week, L = S.settings.weeklyLimit, perDay = L / 7;
    if (selDay === null || selDay > S.dayIndex) selDay = S.dayIndex;
    $('w-label').textContent = 'Неделя · ' + S.weekLabel;
    $('w-spent').textContent = fmt(w.living);
    $('w-sub').textContent = 'из ' + fmt(L) + ' ₽ на жизнь' + (w.left < 0 ? ' · перерасход ' + fmt(-w.left) + ' ₽' : '');
    var vals = w.days.map(function (d) { return d.living; });
    var max = Math.max.apply(null, vals.concat([perDay])) * 1.12;
    $('bars').classList.add('has-sel');
    $('bars').innerHTML = w.days.map(function (d, i) {
      var future = i > S.dayIndex;
      var cls = future ? 'future' : (d.living === 0 ? 'zero' : (d.living > perDay * 1.5 ? 'over' : ''));
      var h = future ? 100 : Math.max(3, d.living / max * 100);
      return '<button class="bcol' + (i === selDay ? ' sel' : '') + '" data-i="' + i + '"' + (future ? ' disabled' : '') +
        ' aria-label="' + DAYS_FULL[i] + ', ' + fmt(d.living) + ' ₽"><div class="b ' + cls + '" style="height:' + h + '%"></div></button>';
    }).join('') + '<div class="line" style="bottom:' + (perDay / max * 100) + '%"></div>';
    $('days').innerHTML = DAYS.map(function (d, i) {
      return '<button data-i="' + i + '" class="' + (i === S.dayIndex ? 'now' : '') + (i === selDay ? ' sel' : '') + '"' + (i > S.dayIndex ? ' disabled' : '') + '>' + d + '</button>';
    }).join('');

    var day = w.days[selDay];
    var dd = day.date.split('-');
    $('day-title').textContent = (selDay === S.dayIndex ? 'Сегодня' : DAYS_FULL[selDay]) + ', ' + Number(dd[2]) + ' ' + MONTHS_GEN[Number(dd[1]) - 1];
    var total = day.entries.reduce(function (s, e) { return s + (e.kind === 'savings' ? 0 : e.amount); }, 0);
    $('day-sum').textContent = day.entries.length ? fmt(total) + ' ₽' : '';
    $('day-list').innerHTML = day.entries.length
      ? day.entries.map(function (e) { return entryRow(e, { deletable: true }); }).join('')
      : '<div class="empty">' + (day.noSpend ? 'Отмечен день без трат' : 'Трат не записано') + '</div>';
    bindDelete($('day-list'));

    $('w-imp').textContent = (w.living ? Math.round(w.impulse / w.living * 100) : 0) + '%';
    $('w-nospend').textContent = w.noSpendDays;
    $('w-nospend-sub').textContent = plural(w.noSpendDays, 'день', 'дня', 'дней');
    $('w-weekend').textContent = fmt(w.weekend);
    $('w-weekend-sub').textContent = 'из ' + fmt(S.settings.weekendWeekly);
    $('w-weekend-sub').classList.toggle('bad', w.weekend > S.settings.weekendWeekly);
  }

  function pickDay(i) {
    if (i > S.dayIndex || i === selDay) return;
    selDay = i; haptic('tap'); renderWeek();
  }

  function renderMonth(animate) {
    var ms = S.months;
    if (monthIdx > ms.length - 1) monthIdx = ms.length - 1;
    var m = ms[monthIdx];
    $('m-label').textContent = cap(m.label);
    $('m-prev').hidden = monthIdx >= ms.length - 1;
    $('m-next').hidden = monthIdx === 0;
    $('m-dots').innerHTML = ms.map(function (_, i) { return '<i class="' + (ms.length - 1 - i === monthIdx ? 'on' : '') + '"></i>'; }).join('');

    var impPct = m.living ? Math.round(m.impulse / m.living * 100) : 0;
    var rows = [
      ['На жизнь', fmt(m.living) + ' ₽'],
      ['Импульсивные', fmt(m.impulse) + ' ₽ · ' + impPct + '%'],
      ['Семейные выходные', fmt(m.weekend) + ' ₽'],
      ['С накоплений', m.savingsCount ? fmt(m.savings) + ' ₽ · ' + m.savingsCount + ' ' + plural(m.savingsCount, 'раз', 'раза', 'раз') : 'ни разу']
    ];
    $('m-rows').innerHTML = rows.map(function (r) { return '<div class="mrow"><span>' + r[0] + '</span><span class="num">' + r[1] + '</span></div>'; }).join('');
    var R = S.settings.reserveMonthly;
    $('m-reserve').textContent = fmt(m.reserve) + ' из ' + fmt(R) + ' ₽';
    $('m-reserve-fill').style.transform = 'scaleX(' + Math.min(1, R ? m.reserve / R : 0) + ')';
    $('m-reserve-fill').style.background = m.reserve > R ? 'var(--bad)' : 'var(--warn)';

    $('noted-card').hidden = !m.notes.length;
    $('noted').innerHTML = m.notes.map(function (e) { return entryRow(e, { date: true }); }).join('');

    var top = m.top.slice(0, 6), topMax = top.length ? top[0].amount : 1;
    $('cats-card').hidden = !top.length;
    $('cats').innerHTML = top.map(function (c) {
      return '<div class="cat"><div class="row-top"><span>' + esc(c.category) + '</span><span class="num">' + fmt(c.amount) + ' ₽</span></div>' +
        '<div class="track"><div class="fill" style="transform:scaleX(' + (c.amount / topMax) + ')"></div></div></div>';
    }).join('');

    $('notes-card').hidden = !m.impulseNotes.length;
    $('notes').innerHTML = m.impulseNotes.map(function (e) { return entryRow(e, { date: true }); }).join('');
    renderHabitMonth();

    if (animate) {
      var body = $('m-body'); body.classList.add('fade');
      requestAnimationFrame(function () { requestAnimationFrame(function () { body.classList.remove('fade'); }); });
    }
  }

  function goMonth(delta) {
    var next = monthIdx + delta;
    if (!S || next < 0 || next > S.months.length - 1) return;
    monthIdx = next; haptic('tap'); renderMonth(true);
  }

  function bindSummary() {
    $('bars').addEventListener('click', function (ev) { var b = ev.target.closest('.bcol'); if (b) pickDay(Number(b.getAttribute('data-i'))); });
    $('days').addEventListener('click', function (ev) { var b = ev.target.closest('button'); if (b) pickDay(Number(b.getAttribute('data-i'))); });
    $('m-prev').addEventListener('click', function () { goMonth(1); });
    $('m-next').addEventListener('click', function () { goMonth(-1); });
    // Свайп по карточке «Привычки» листает привычки, по остальной сводке – месяцы.
    var x0 = null, y0 = null, onHab = false;
    $('months').addEventListener('touchstart', function (ev) {
      x0 = ev.touches[0].clientX; y0 = ev.touches[0].clientY;
      onHab = !!ev.target.closest('#habm-card') && !!S && !!S.habits && S.habits.length > 1;
    }, { passive: true });
    $('months').addEventListener('touchend', function (ev) {
      if (x0 === null) return;
      var dx = ev.changedTouches[0].clientX - x0, dy = ev.changedTouches[0].clientY - y0;
      x0 = null;
      if (!(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5)) return;
      if (onHab) goHabit(dx > 0 ? -1 : 1); else goMonth(dx > 0 ? 1 : -1);
    }, { passive: true });
  }

  /* ---------- привычки ---------- */
  var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var CROSS_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  // Те же правила, что streak_ и bestStreak_ в Code.gs: пока сегодня не отмечено, серия считается до вчера.
  function habStreak(dates, today) {
    var set = {}; dates.forEach(function (d) { set[d] = 1; });
    var d = set[today] ? today : addDays(today, -1), n = 0;
    while (set[d]) { n++; d = addDays(d, -1); }
    return n;
  }
  function habBest(dates) {
    var best = 0, run = 0, prev = '';
    dates.forEach(function (d) { run = prev && addDays(prev, 1) === d ? run + 1 : 1; if (run > best) best = run; prev = d; });
    return best;
  }
  function findHabit(id) { return (S.habits || []).filter(function (h) { return h.id === id; })[0] || null; }
  function setMark(h, date, done) {
    var has = h.dates.indexOf(date) >= 0;
    if (done && !has) { h.dates.push(date); h.dates.sort(); }
    if (!done && has) h.dates = h.dates.filter(function (d) { return d !== date; });
  }

  function habLoading(el) {
    el.innerHTML = '<div class="empty">' + esc(habErr ? 'Не удалось загрузить привычки: ' + habErr : 'Загружаю привычки…') + '</div>';
  }

  function renderHabits() {
    Array.prototype.forEach.call($('hab-day').children, function (b) { b.classList.toggle('on', Number(b.getAttribute('data-d')) === habDay); });
    if (!S.habits) { habLoading($('hab-list')); return; }
    var hs = S.habits, date = addDays(S.today, -habDay);
    $('hab-day').hidden = !hs.length;
    if (!hs.length) { $('hab-list').innerHTML = '<div class="empty">Добавьте первую привычку кнопкой «+» – например, зарядку или 20 страниц книги.</div>'; return; }
    $('hab-list').innerHTML = hs.map(function (h) {
      var done = h.dates.indexOf(date) >= 0, streak = habStreak(h.dates, S.today);
      return '<div class="hrow">' +
        '<button class="hcheck' + (done ? ' on' : '') + '" data-id="' + esc(h.id) + '" aria-pressed="' + done + '" aria-label="' + esc(h.name) + ': отметить за ' + (habDay ? 'вчера' : 'сегодня') + '">' + CHECK_SVG + '</button>' +
        '<span class="hname">' + esc(h.name) + '</span>' +
        '<span class="hs num' + (streak ? '' : ' zero') + '"><b>' + streak + '</b>' + plural(streak, 'день', 'дня', 'дней') + ' подряд</span>' +
        '</div>';
    }).join('');
  }

  // Сводка: календарь выбранного месяца по каждой привычке
  function renderHabitMonth() {
    var card = $('habm-card');
    if (!S.habits) { card.hidden = false; $('habm-label').textContent = ''; habLoading($('habm')); return; }
    card.hidden = !S.habits.length;
    if (!S.habits.length) return;
    var m = S.months[monthIdx], key = m.key;
    var y = Number(key.slice(0, 4)), mo = Number(key.slice(5, 7));
    var dim = new Date(Date.UTC(y, mo, 0)).getUTCDate();
    var first = key + '-01', lead = (new Date(first + 'T00:00:00Z').getUTCDay() + 6) % 7;
    $('habm-label').textContent = cap(m.label);
    var n = S.habits.length;
    if (habIdx > n - 1) habIdx = n - 1;
    if (habIdx < 0) habIdx = 0;
    $('habm').innerHTML = [S.habits[habIdx]].map(function (h) {
      var cells = DAYS.map(function (d) { return '<span>' + d + '</span>'; }).join('');
      for (var k = 0; k < lead; k++) cells += '<b></b>';
      var done = 0, possible = 0;
      for (var dd = 1; dd <= dim; dd++) {
        var date = key + '-' + (dd < 10 ? '0' : '') + dd;
        var on = h.dates.indexOf(date) >= 0;
        var off = date > S.today || date < h.created;
        if (on) done++;
        if (!off) possible++;
        cells += '<i class="' + (on ? 'on' : (off ? 'off' : '')) + (date === S.today ? ' cur' : '') + '" title="' + shortDate(date) + (on ? ', сделано' : '') + '">' + (on ? CHECK_SVG : '') + '</i>';
      }
      var streak = habStreak(h.dates, S.today), best = habBest(h.dates);
      var sub = streak + ' ' + plural(streak, 'день', 'дня', 'дней') + ' подряд' + (best > streak && best > 1 ? ' · рекорд ' + best : '');
      var nav = function (step, hide, label, svg) { return '<button class="arrow" data-hstep="' + step + '" aria-label="' + label + '"' + (hide ? ' hidden' : '') + '>' + svg + '</button>'; };
      return '<div class="hnav">' + nav(-1, habIdx === 0, 'Предыдущая привычка', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>') +
        '<div class="hnav-mid"><button class="hm-name" data-del="' + esc(h.id) + '" aria-label="' + esc(h.name) + ': убрать привычку">' + esc(h.name) + '</button>' +
        (n > 1 ? '<span class="label num">' + (habIdx + 1) + ' / ' + n + '</span>' : '') + '</div>' +
        nav(1, habIdx >= n - 1, 'Следующая привычка', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>') + '</div>' +
        '<div class="hm" id="hm-cur"><div class="hm-sub num">' + (possible ? done + ' из ' + possible + ' · ' : '') + sub + '</div>' +
        '<div class="hgrid" aria-hidden="true">' + cells + '</div></div>';
    }).join('');
  }

  function goHabit(delta) {
    if (!S || !S.habits) return;
    var next = habIdx + delta;
    if (next < 0 || next > S.habits.length - 1) return;
    habIdx = next; haptic('tap'); renderHabitMonth();
    var el = $('hm-cur'); el.classList.add('fade');
    requestAnimationFrame(function () { requestAnimationFrame(function () { el.classList.remove('fade'); }); });
  }

  function toggleHabit(id) {
    if (id.indexOf('tmp-') === 0) { toast('Привычка ещё сохраняется, попробуйте через секунду'); return; }
    var h = findHabit(id); if (!h) return;
    var daysAgo = habDay, date = addDays(S.today, -daysAgo);
    var done = h.dates.indexOf(date) < 0;
    setMark(h, date, done); renderHabits(); renderHabitMonth(); haptic(done ? 'success' : 'tap');
    send('habitMark', { id: id, daysAgo: daysAgo, done: done }, function () { var x = findHabit(id); if (x) setMark(x, date, !done); });
  }

  function confirmHabit() {
    var name = $('sheet-input').value.replace(/\s+/g, ' ').trim();
    if (!name) { sheetError('Напишите название привычки'); return; }
    var low = name.toLowerCase();
    if (S.habits.some(function (h) { return h.name.toLowerCase() === low; })) { sheetError('Такая привычка уже есть'); return; }
    if (S.habits.length >= 20) { sheetError('Не больше 20 привычек'); return; }
    closeNote();
    var id = 'tmp-' + Date.now();
    S.habits.push({ id: id, name: name, created: S.today, dates: [] });
    render(); haptic('success'); toast('Добавлено: ' + name);
    send('habitAdd', { name: name }, function () { S.habits = S.habits.filter(function (h) { return h.id !== id; }); });
  }

  function askRemoveHabit(id) {
    if (id.indexOf('tmp-') === 0) { toast('Привычка ещё сохраняется, попробуйте через секунду'); return; }
    var h = findHabit(id); if (!h) return;
    var text = 'Убрать привычку «' + h.name + '»? Отметки останутся в таблице.';
    var go = function (ok) {
      if (!ok) return;
      var at = S.habits.indexOf(h);
      S.habits.splice(at, 1); render(); toast('Привычка убрана');
      send('habitRemove', { id: id }, function () { S.habits.splice(at, 0, h); });
    };
    if (tg && !DEMO && tg.isVersionAtLeast('6.2')) tg.showConfirm(text, go); else go(window.confirm(text));
  }

  function bindHabits() {
    $('hab-list').addEventListener('click', function (ev) {
      var c = ev.target.closest('.hcheck'); if (c) toggleHabit(c.getAttribute('data-id'));
    });
    $('habm').addEventListener('click', function (ev) {
      var st = ev.target.closest('[data-hstep]'); if (st) { goHabit(Number(st.getAttribute('data-hstep'))); return; }
      var d = ev.target.closest('.hm-name'); if (d) askRemoveHabit(d.getAttribute('data-del'));
    });
    $('hab-day').addEventListener('click', function (ev) {
      var b = ev.target.closest('button'); if (!b) return;
      habDay = Number(b.getAttribute('data-d')); haptic('tap'); if (S) renderHabits();
    });
    $('hab-add').addEventListener('click', openHabitSheet);
  }

  /* ---------- вкладки, уведомления ---------- */
  var VIEWS = { add: ['view-add', 'tab-add'], summary: ['view-sum', 'tab-sum'] };
  function show(view) {
    if (!VIEWS[view]) view = 'add';
    Object.keys(VIEWS).forEach(function (k) {
      $(VIEWS[k][0]).hidden = k !== view;
      $(VIEWS[k][1]).classList.toggle('on', k === view);
    });
    if (view === 'summary' && S) { selDay = S.dayIndex; monthIdx = 0; renderWeek(); renderMonth(false); }
    window.scrollTo(0, 0);
  }
  var toastTimer;
  function toast(text, isErr) {
    var t = $('toast'); t.textContent = text; t.classList.toggle('err', !!isErr); t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, isErr ? 4000 : 1800);
  }
  function fatal(text) { $('app').innerHTML = '<div class="fatal">' + esc(text) + '</div>'; }

  /* ---------- демо-данные ---------- */
  function localToday() {
    var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function demoState() {
    var today = localToday();
    var dow = (new Date(today + 'T00:00:00Z').getUTCDay() + 6) % 7;
    var ws = addDays(today, -dow), we = addDays(ws, 6);
    var a = ws.split('-'), b = we.split('-');
    var label = Number(a[2]) + (a[1] === b[1] ? '' : ' ' + MONTHS_SHORT[Number(a[1]) - 1]) + ' – ' + Number(b[2]) + ' ' + MONTHS_SHORT[Number(b[1]) - 1];
    var n = 0;
    var mk = function (cat, amount, imp, note) { return { id: 'd' + (++n), category: cat, kind: KIND[cat], amount: amount, impulse: !!imp, note: note || '' }; };
    var plan = [
      [mk('Продукты', 1840), mk('Такси', 620, true, 'опаздывал, вышел поздно'), mk('Автобус', 45)],
      [mk('Кофе', 250), mk('Автобус', 90)],
      [],
      [mk('Продукты', 2310), mk('Здоровье', 1200, false, 'аптека')],
      [mk('Другое', 980, false, 'подарок коллеге')],
      [mk('Кофе', 290, true, 'устал после работы'), mk('Продукты', 1240), mk('Выходные', 1800, false, 'кафе с семьёй')],
      [mk('Выходные', 950, false, 'фастфуд на прогулке')]
    ];
    var days = plan.map(function (list, i) {
      var date = addDays(ws, i);
      var entries = i > dow ? [] : list.map(function (e) { return Object.assign({ date: date }, e); }).reverse();
      return { date: date, living: entries.reduce(function (s, e) { return s + (e.kind === 'living' ? e.amount : 0); }, 0), noSpend: i === 2 && i <= dow, entries: entries };
    });
    var all = [].concat.apply([], days.map(function (d) { return d.entries; }));
    var sum = function (f) { return all.filter(f).reduce(function (s, e) { return s + e.amount; }, 0); };
    var living = sum(function (e) { return e.kind === 'living'; });
    var impulse = sum(function (e) { return e.impulse; });
    var weekend = sum(function (e) { return e.kind === 'weekend'; });
    var curKey = today.slice(0, 7);
    var months = [];
    for (var i = 0; i < 6; i++) {
      var d = new Date(Date.UTC(Number(curKey.slice(0, 4)), Number(curKey.slice(5, 7)) - 1 - i, 1));
      var key = d.toISOString().slice(0, 7);
      var lbl = MONTHS[d.getUTCMonth()] + (key.slice(0, 4) === curKey.slice(0, 4) ? '' : ' ' + key.slice(0, 4));
      var k = 1 - i * 0.07;
      months.push({
        key: key, label: lbl,
        living: Math.round((i === 0 ? living + 21400 : 41000) * k), impulse: Math.round((i === 0 ? impulse + 4020 : 6100) * k),
        weekend: i === 0 ? weekend + 5400 : 8600, reserve: i === 0 ? 15000 : [0, 3200, 900, 12500, 0][i - 1], savings: i === 0 ? 6000 : 9000 * k, savingsCount: i === 0 ? 2 : 3,
        top: [{ category: 'Продукты', amount: Math.round(18800 * k) }, { category: 'Такси', amount: Math.round(4900 * k) }, { category: 'Кофе', amount: Math.round(2650 * k) },
          { category: 'Автобус', amount: 1350 }, { category: 'Дом', amount: 2100 }, { category: 'Себе', amount: 1480 }],
        impulseNotes: i === 0 ? all.filter(function (e) { return e.impulse && e.note; }).concat([{ id: 'x1', date: addDays(today, -9), category: 'Себе', kind: 'living', amount: 1990, impulse: true, note: 'увидел скидку в ленте' }]) : [],
        notes: i === 0 ? all.filter(function (e) { return NOTE_REQ[e.category] && e.note; }).concat([
          { id: 'x2', date: addDays(today, -12), category: 'Здоровье', kind: 'reserve', amount: 12500, impulse: false, note: 'операция, предоплата' },
          { id: 'x3', date: addDays(today, -14), category: 'С накоплений', kind: 'savings', amount: 6000, impulse: false, note: 'не хватило до зарплаты' }
        ]).sort(function (x, y) { return x.date < y.date ? 1 : -1; }) : (i === 1 ? [{ id: 'x4', date: key + '-14', category: 'Непредвиденное', kind: 'reserve', amount: 3200, impulse: false, note: 'ремонт стиральной машины' }] : [])
      });
    }
    var tDay = days[dow];
    return {
      today: today, settings: { weeklyLimit: 11000, weekendWeekly: 2500, reserveMonthly: 10000 },
      weekLabel: label, monthLabel: months[0].label, dayIndex: dow, daysLeft: 7 - dow,
      todayEntries: tDay.entries.map(function (e) { return Object.assign({}, e); }), todayMarkedNoSpend: tDay.noSpend,
      week: { living: living, impulse: impulse, weekend: weekend, left: 11000 - living, noSpendDays: dow > 2 ? 1 : 0, days: days },
      month: months[0], months: months,
      suggestions: { 'Себе': ['книга', 'футболка'], 'Здоровье': ['аптека', 'анализы', 'стоматолог'], 'Выходные': ['кафе с семьёй', 'фастфуд на прогулке'], 'Другое': ['подарок коллеге'], 'С накоплений': ['не хватило до зарплаты'] },
      habits: [
        { id: 'h1', name: 'Зарядка', created: addDays(today, -60), dates: range(-12, -1).concat(range(-40, -21)).sort() },
        { id: 'h2', name: 'Чтение 20 минут', created: addDays(today, -20), dates: range(-4, 0) },
        { id: 'h3', name: 'Без сладкого', created: addDays(today, -10), dates: [addDays(today, -4), addDays(today, -3), addDays(today, -1)] }
      ]
    };
    function range(from, to) { var r = []; for (var j = from; j <= to; j++) r.push(addDays(today, j)); return r; }
  }

  /* ---------- запуск ---------- */
  function start() {
    if (tg) { try { tg.ready(); tg.expand(); if (tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes(); tg.onEvent('themeChanged', applyTheme); } catch (e) {} }
    applyTheme();
    if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
    buildForm();
    bindSummary();
    bindHabits();
    $('tab-add').addEventListener('click', function () { show('add'); });
    $('tab-sum').addEventListener('click', function () { show('summary'); });

    if (DEMO) { $('demo').hidden = false; S = demoState(); render(); show(qs.get('view')); return; }
    show(qs.get('view'));
    if (!/^https:\/\/script\.google\.com\/(a\/macros\/[\w.-]+|macros)\/s\/[\w-]+\/exec$/.test(API)) {
      fatal('Не задан адрес сервера. Откройте трекер кнопкой в чате с ботом.'); return;
    }
    var cached = loadCache();
    if (cached && cached.months) { S = cached; render(); }
    api('state').then(function (data) {
      if (pending === 0) { S = data; saveCache(); render(); }
    }).catch(function (err) {
      habErr = err.message;
      if (S) { toast(err.message, true); render(); } else fatal(err.message);
    });
  }

  start();
})();
</script>
</body>
